BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "epics"
BBFILE_PATTERN_epics = "^${LAYERDIR}/"
BBFILE_PRIORITY_epics = "6"

# This layer uses S = "${WORKDIR}/git", which requires the pre-Styhead
# unpack layout; only the release this PetaLinux project is built against
# may be listed here.
LAYERSERIES_COMPAT_epics = "scarthgap"
LAYERDEPENDS_epics = "core"
