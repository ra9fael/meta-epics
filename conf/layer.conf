BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "impcas-epics"
BBFILE_PATTERN_impcas-epics = "^${LAYERDIR}/"
BBFILE_PRIORITY_impcas-epics = "6"

# This layer uses S = "${WORKDIR}/git", which requires the pre-Styhead
# unpack layout; only the release this PetaLinux project is built against
# may be listed here.
LAYERSERIES_COMPAT_impcas-epics = "scarthgap"
LAYERDEPENDS_impcas-epics = "core"
